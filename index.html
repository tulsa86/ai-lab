<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Lab | Learn. Build. Understand.</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9eef9;background:#090e1b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0%,#1b2c52 0,transparent 36%),#090e1b}button,input,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{padding:28px 16px;background:#0d1425;border-right:1px solid #253149}.brand{font-weight:850;font-size:23px;letter-spacing:.08em;margin:0 12px 6px}.brand span{color:#79a7ff}.tag{color:#8796b2;font-size:12px;margin:0 12px 36px}.nav{display:grid;gap:8px}.nav button{background:transparent;color:#a8b7d2;text-align:left;border:0;border-radius:10px;padding:13px 15px}.nav button.active,.nav button:hover{background:#1c2c4c;color:white}.foot{font-size:12px;color:#7f90ac;margin:34px 12px}.main{max-width:1100px;width:100%;margin:auto;padding:35px 38px 70px}.eyebrow{color:#81a8fb;font-weight:750;text-transform:uppercase;letter-spacing:.13em;font-size:12px}h1{font-size:clamp(30px,5vw,47px);margin:12px 0}h2{font-size:24px;margin:0 0 16px}h3{margin:0 0 8px}p{line-height:1.6;color:#b7c5df}.hero{background:linear-gradient(125deg,#203b6c,#142441 70%);border:1px solid #39517a;border-radius:20px;padding:30px;margin-bottom:24px}.hero p{max-width:680px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:22px 0}.stat,.panel,.lesson,.project{background:#121d31;border:1px solid #293a56;border-radius:16px;padding:22px}.stat strong{font-size:30px;display:block}.muted,.small{color:#8ea0bf;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.panel{margin:0 0 17px}.pill{display:inline-block;border-radius:99px;padding:5px 10px;background:#263e63;color:#b9d3ff;font-size:12px}.primary,.secondary{border:0;border-radius:10px;padding:12px 16px;font-weight:750;background:#81aaff;color:#081225}.secondary{background:#233957;color:#dce7fb;border:1px solid #3b5173}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.bar{height:8px;border-radius:8px;background:#28374f;overflow:hidden;margin-top:12px}.bar>div{height:100%;background:#79a7ff;transition:width .2s}.lesson,.project{margin-bottom:12px}.lesson-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.lesson h3{font-size:17px}.hidden{display:none!important}.content{max-width:790px}.content p{color:#c9d4e9}.content li{margin:12px 0;line-height:1.55}.question{padding:18px;background:#182740;border-radius:12px;margin:16px 0}.answer{display:block;width:100%;margin:8px 0;padding:12px;text-align:left;background:#0d182b;border:1px solid #3c5070;border-radius:9px;color:#e9eef9}.answer.selected{border-color:#8cb5ff;background:#243d62}.feedback{padding:14px;border-radius:10px;background:#223a54;margin:12px 0}.field{width:100%;background:#0d1728;border:1px solid #425574;border-radius:10px;padding:13px;color:#fff;min-height:48px}.promptbox{min-height:120px;resize:vertical}.note{font-size:13px;color:#9aacc8}.badge-done{color:#9de6c0}.section{margin-top:28px}.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.callout{border-left:3px solid #7ca9fa;padding:10px 16px;background:#172842;margin:18px 0;border-radius:0 10px 10px 0}.mobile-nav{display:none}@media(max-width:800px){.app{display:block}.sidebar{padding:17px;border-right:0;border-bottom:1px solid #263751}.brand{font-size:20px}.tag{margin-bottom:15px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.foot{display:none}.main{padding:22px 16px 60px}.grid,.cards3{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:22px}.hero{padding:22px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">AI <span>LAB</span></div><div class="tag">LEARN · BUILD · UNDERSTAND</div><nav class="nav" id="nav"><button data-view="home" class="active">⌂ &nbsp; Dashboard</button><button data-view="curriculum">▤ &nbsp; Curriculum</button><button data-view="explore">✧ &nbsp; Open Lab</button><button data-view="projects">⚒ &nbsp; Project Workshop</button><button data-view="journal">◫ &nbsp; Lab Notebook</button></nav><div class="foot">Your progress is stored in this browser.<br>Version 1.0 · No account required</div></aside><main class="main" id="main"></main></div><script>
const lessons=[
{id:'l1',level:1,title:'What is AI, really?',time:'10 min',intro:'AI is software trained or designed to perform tasks that normally require human judgment, such as recognizing patterns, interpreting language, or predicting outcomes.',why:'A language model does not look up every sentence in a giant answer book. During training it adjusts numerical parameters to predict patterns in data. At use time, it generates a response from the context and learned patterns.',example:'When you ask for an RFQ, a model predicts and organizes relevant language based on your instructions. It can write a professional-looking document even when key specifications are missing. That is why verification matters.',challenge:'Ask an AI to write an RFQ for 500 O-rings without providing dimensions or material. Identify at least four details it should ask for rather than invent.',q:'Why can an AI give a confident but incorrect answer?',choices:['It always searches the internet first','Generating plausible language is not the same as verifying facts','It secretly knows the answer but hides it'],correct:1,explain:'Models can generate fluent predictions without checking the truth. Grounding, source checks, and explicit constraints reduce this risk.'},
{id:'l2',level:1,title:'Tokens, context, and memory',time:'12 min',intro:'Language models process text in tokens, which may be whole words, word pieces, or punctuation. The context window is the information available during a particular response.',why:'A model needs context to follow a conversation. A long conversation can exceed what is available, and saved memory is different from the text currently inside a model’s context.',example:'A project instruction that says “never invent vehicle prices” can change the model’s behavior. But a long chat does not guarantee every old instruction stays available.',challenge:'Write a five-line project brief for a vehicle scout that includes purpose, inputs, outputs, constraints, and how to handle unknown data.',q:'What is a context window?',choices:['The model’s available working information for a response','A permanent database of everything you have said','The computer monitor showing your chat'],correct:0,explain:'Context is the information available to the model for that response, not an unlimited permanent memory.'},
{id:'l3',level:1,title:'Prompting as specification writing',time:'12 min',intro:'A useful prompt defines the goal, relevant context, constraints, and the desired output. You already use this skill in purchasing.',why:'Without constraints, a model fills gaps with likely assumptions. Specific instructions make the output easier to evaluate and repeat.',example:'“Compare these two quotes; flag missing data; do not assume equivalent material grades; return a table” is more reliable than “Which quote is best?”',challenge:'Rewrite a vague request into a structured prompt that refuses to invent missing supplier information.',q:'Which instruction most directly prevents invented technical details?',choices:['Make it sound professional','Use a confident tone','Mark missing specifications as unknown and ask for them'],correct:2,explain:'Explicit uncertainty handling tells the model what to do when evidence is missing.'},
{id:'l4',level:2,title:'How to verify AI research',time:'15 min',intro:'Treat generated answers as hypotheses until the important claims have evidence.',why:'Sources may be outdated, misread, biased, or unrelated. Even a citation can fail to support the exact claim.',example:'For a used vehicle, asking prices are not proof of sale value. A defensible valuation separates asking comps, confirmed sales, condition, and local market differences.',challenge:'Find three vehicle listings for the same trim and year, record the differences, and explain why their prices might not be directly comparable.',q:'What is the strongest evidence of resale value?',choices:['One unusually expensive listing','Several verified comparable sales adjusted for condition','The seller’s claim that it is worth more'],correct:1,explain:'Verified transactions, when available, are more informative than unverified asking prices.'},
{id:'l5',level:3,title:'APIs explained without the headache',time:'15 min',intro:'An API is a documented way for software to request data or actions from another system.',why:'Instead of copying information manually, an application sends a structured request and receives a structured response. Access still depends on permissions, limits, and available endpoints.',example:'A weather app can ask a weather service for forecast data. Facebook Marketplace does not offer a general public API for retrieving local vehicle listings.',challenge:'Draw the flow: your app → API request → provider → response → your dashboard. Identify where errors and fees could occur.',q:'What does an API key commonly do?',choices:['Guarantee every request is free','Identify or authorize a caller','Make AI answers automatically accurate'],correct:1,explain:'Keys are credentials used to control access and track usage. Never place private API keys in public GitHub Pages code.'},
{id:'l6',level:4,title:'Automation vs. AI agents',time:'15 min',intro:'An automation follows a defined workflow. An agent can choose among tools or actions toward a goal, subject to its instructions and permissions.',why:'More autonomy creates more possibilities and more ways to fail. Reliable systems need logs, limits, checkpoints, and clear permission boundaries.',example:'A simple automation emails you when a supplier is late. An agent might check several systems, draft a follow-up, and ask you to approve sending it.',challenge:'Design an agent that evaluates a Marketplace screenshot but cannot contact sellers or spend money without approval.',q:'What is a sensible safeguard for a purchasing agent?',choices:['Give it unlimited purchasing authority','Hide errors from the operator','Require approval before placing orders'],correct:2,explain:'Human approval protects against expensive errors and unexpected behavior.'},
{id:'l7',level:5,title:'Build a trustworthy AI workflow',time:'18 min',intro:'A production workflow needs data validation, error handling, observability, and tests, not just a clever prompt.',why:'An AI model is one component of a system. The system must handle missing inputs, uncertain outputs, and failed connections.',example:'A flip estimator should record which comparable listings support its value, flag stale prices, and avoid giving a confident maximum bid from insufficient evidence.',challenge:'Write three test cases: missing mileage, salvage title, and no local comparable sales. Describe the correct safe behavior.',q:'What should a valuation system do with no trustworthy comps?',choices:['Invent a midpoint price','Report low confidence and request more evidence','Use the highest advertised listing'],correct:1,explain:'Explicit uncertainty is a feature, not a defect.'},
{id:'l8',level:6,title:'RAG, fine-tuning, and evaluations',time:'20 min',intro:'Retrieval-augmented generation (RAG) supplies relevant reference information to a model. Fine-tuning changes model behavior through additional training. Evaluations measure how well the system performs.',why:'Use retrieval when the facts change or must be traceable. Consider fine-tuning for repeatable behavior or style when simpler methods are insufficient. Test either approach against real examples.',example:'A parts assistant should retrieve current catalog specifications rather than relying on a model to memorize part compatibility.',challenge:'Design a 10-example evaluation set for an O-ring RFQ assistant, including missing specs and conflicting drawings.',q:'What is usually better for frequently changing product specifications?',choices:['Retrieval from a maintained source','Asking the model to guess','Never checking catalog revisions'],correct:0,explain:'Retrieval can access current, traceable information without retraining for every catalog update.'}
];
const projects=[{id:'p1',name:'Marketplace Screenshot Analyzer',level:'Beginner → Intermediate',desc:'Extract listing facts, mark unknowns, and save the results. Later add comps and profitability.',steps:['Define the required listing fields','Collect five sample screenshots','Extract details and flag uncertainty','Save entries locally','Test with missing or misleading information']},{id:'p2',name:'RFQ Quality Checker',level:'Beginner → Intermediate',desc:'Review an RFQ for missing requirements without inventing engineering specifications.',steps:['List required RFQ fields','Create synthetic sample RFQs','Identify omissions','Generate supplier clarification questions','Measure false positives']},{id:'p3',name:'AI Agent Safety Simulator',level:'Intermediate',desc:'Design an agent that recommends actions but needs approval before spending money.',steps:['Choose permitted actions','Define forbidden actions','Write approval rules','Create error scenarios','Test the agent decision log']}];
const storeKey='ai-lab-v1';let state;try{state=JSON.parse(localStorage.getItem(storeKey))||{}}catch{state={}};state.done||=[];state.notes||='';state.projectSteps||={};state.customTopics||=[];let view='home',openLesson=null,selected=null,feedback='';function save(){localStorage.setItem(storeKey,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function progress(){return Math.round(state.done.length/lessons.length*100)}function btn(label,fn,cls='primary'){return `<button class="${cls}" onclick="${fn}">${label}</button>`}function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const el=document.getElementById('main');if(openLesson){el.innerHTML=lessonView();return}if(view==='home')el.innerHTML=home();if(view==='curriculum')el.innerHTML=curriculum();if(view==='explore')el.innerHTML=explore();if(view==='projects')el.innerHTML=projectView();if(view==='journal')el.innerHTML=journal()}
function home(){let next=lessons.find(l=>!state.done.includes(l.id))||lessons[lessons.length-1];return `<div class="eyebrow">Your personal learning headquarters</div><h1>Learn it. Build it.<br>Understand it.</h1><div class="hero"><span class="pill">HYBRID LEARNING MODE</span><h2 style="margin-top:16px">A classroom when you need direction.<br>A laboratory when curiosity takes over.</h2><p>Master AI from the foundations through agents and advanced systems. Every lesson explains the <b>why</b>, then makes you prove it with a practical challenge.</p>${btn('Continue learning →',`startLesson('${next.id}')`) } ${btn('Explore freely',`go('explore')`,'secondary')}</div><div class="stats"><div class="stat"><strong>${progress()}%</strong><span class="muted">Curriculum complete</span></div><div class="stat"><strong>${state.done.length}/${lessons.length}</strong><span class="muted">Lessons passed</span></div><div class="stat"><strong>${projects.length}</strong><span class="muted">Starter projects</span></div></div><div class="grid"><div class="panel"><div class="eyebrow">Up next</div><h2>${esc(next.title)}</h2><p>${esc(next.intro)}</p>${btn('Open lesson',`startLesson('${next.id}')`)}</div><div class="panel"><div class="eyebrow">Project spotlight</div><h2>Vehicle FlipScout</h2><p>Start with Marketplace screenshots. Learn extraction, data storage, and valuation without pretending we can scrape Facebook.</p>${btn('Open workshop',`go('projects')`,'secondary')}</div></div><div class="callout"><b>The rule:</b> Completing a quiz is only part of learning. You should also finish the hands-on challenge and explain the result in your own words.</div>`}
function curriculum(){return `<div class="eyebrow">Structured pathway</div><h1>Your curriculum</h1><p>Eight starter lessons across six levels. Work in order or jump to anything you want. These are introductory lessons, not a claim that you've mastered a whole field.</p><div class="bar"><div style="width:${progress()}%"></div></div><p class="small">${state.done.length} of ${lessons.length} knowledge checks passed</p><div class="section">${lessons.map(l=>`<div class="lesson"><div class="lesson-head"><div><span class="pill">LEVEL ${l.level} · ${l.time}</span><h3 style="margin-top:12px">${esc(l.title)}</h3><span class="small">${esc(l.intro)}</span></div><div>${state.done.includes(l.id)?'<b class="badge-done">✓ Passed</b>':' '}</div></div><div class="actions">${btn('Open lesson →',`startLesson('${l.id}')`,'secondary')}</div></div>`).join('')}</div>`}
function lessonView(){let l=lessons.find(x=>x.id===openLesson);return `<div class="content">${btn('← Back to curriculum',`closeLesson()`,'secondary')}<div class="section eyebrow">Level ${l.level} · ${l.time}</div><h1>${esc(l.title)}</h1><div class="panel"><h2>What you're learning</h2><p>${esc(l.intro)}</p><h2>Why it works this way</h2><p>${esc(l.why)}</p><h2>Real-world example</h2><p>${esc(l.example)}</p></div><div class="panel"><div class="eyebrow">Hands-on challenge</div><h2>Try it yourself</h2><p>${esc(l.challenge)}</p><textarea id="challengeNote" class="field promptbox" placeholder="Write what you tried, what happened, and why you think it happened...">${esc(state['note-'+l.id]||'')}</textarea><div class="actions">${btn('Save challenge notes',`saveChallenge('${l.id}')`,'secondary')}</div></div><div class="panel"><div class="eyebrow">Knowledge check</div><h2>Prove you understand</h2><p>${esc(l.q)}</p>${l.choices.map((c,i)=>`<button class="answer ${selected===i?'selected':''}" onclick="choose(${i})">${esc(c)}</button>`).join('')}${btn('Check answer',`checkAnswer('${l.id}')`)}${feedback?`<div class="feedback">${esc(feedback)}</div>`:''}</div></div>`}
function explore(){return `<div class="eyebrow">Open exploration</div><h1>Follow your curiosity</h1><p>No prerequisites. Choose a topic, experiment, then record what you learned. These are ready-to-copy prompts for use with your preferred AI assistant.</p><div class="grid">${[['How do AI agents use tools?','Explain AI tool calling using a vehicle scout as an example. Show the inputs, decisions, errors, and safeguards. Then give me a hands-on exercise.'],['How do databases work?','Teach me databases by designing a used-car listing tracker. Explain tables, records, keys, and why they matter without assuming I know SQL.'],['How does computer vision work?','Explain how an AI reads a Facebook Marketplace screenshot, what it can and cannot reliably extract, and how to test its accuracy.'],['How do APIs work?','Teach me APIs using a free public example. Explain request, response, authentication, limits, and how to avoid exposing secrets.'],['Can AI actually reason?','Explain the difference between pattern prediction, reasoning, verification, and tool use. Include a small experiment that reveals a failure mode.'],['What changed in AI recently?','Help me research major recent AI developments with dated sources. Distinguish verified changes from hype, and explain which skills I should revisit.']].map(([name,prompt])=>`<div class="panel"><h3>${esc(name)}</h3><p class="small">Experiment prompt</p><p>${esc(prompt)}</p>${btn('Copy experiment',`copyText(${JSON.stringify(prompt).replace(/'/g,'&#39;')})`,'secondary')}</div>`).join('')}</div><div class="panel"><h2>My exploration queue</h2><div class="actions"><input id="newtopic" class="field" placeholder="Something I want to understand..." style="flex:1">${btn('Add topic',`addTopic()`)}</div>${state.customTopics.map((t,i)=>`<p>◦ ${esc(t)} <button class="secondary" style="padding:5px 9px" onclick="removeTopic(${i})">Remove</button></p>`).join('')}</div>`}
function projectView(){return `<div class="eyebrow">Learn by making things</div><h1>Project workshop</h1><p>These are guided project plans. Check off completed steps as you work. The site does not secretly run AI models or fetch external data.</p>${projects.map(p=>`<div class="project"><span class="pill">${esc(p.level)}</span><h2 style="margin-top:14px">${esc(p.name)}</h2><p>${esc(p.desc)}</p>${p.steps.map((s,i)=>`<label style="display:flex;gap:12px;align-items:flex-start;margin:14px 0;color:#d3dff1"><input type="checkbox" ${state.projectSteps[p.id+'-'+i]?'checked':''} onchange="toggleStep('${p.id}',${i},this.checked)" style="accent-color:#83afff;width:19px;height:19px"> ${esc(s)}</label>`).join('')}</div>`).join('')}`}
function journal(){return `<div class="eyebrow">Reflect and remember</div><h1>Lab notebook</h1><p>Write down what you built, why it worked, where it failed, and what you want to try next. Saved locally in this browser.</p><div class="panel"><h2>My notes</h2><textarea id="journalText" class="field promptbox" style="min-height:300px" placeholder="Today I learned...">${esc(state.notes)}</textarea><div class="actions">${btn('Save notebook',`saveJournal()`) } ${btn('Export my progress',`exportData()`,'secondary')} ${btn('Import saved progress',`document.getElementById('importFile').click()`,'secondary')}</div><input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(this)"><p class="note">Export periodically. Browser storage may be cleared and does not sync between devices.</p></div>`}
function go(v){view=v;openLesson=null;selected=null;feedback='';render();window.scrollTo(0,0)}function startLesson(id){openLesson=id;selected=null;feedback='';render();window.scrollTo(0,0)}function closeLesson(){openLesson=null;view='curriculum';render()}function choose(i){selected=i;feedback='';render()}function checkAnswer(id){let l=lessons.find(x=>x.id===id);if(selected===null){feedback='Choose an answer first.'}else if(selected===l.correct){feedback='Correct. '+l.explain+' Now make sure you can explain it in your own words and complete the challenge.';if(!state.done.includes(id))state.done.push(id);save()}else{feedback='Not quite. '+l.explain+' Try again.'}render()}function saveChallenge(id){state['note-'+id]=document.getElementById('challengeNote').value;save();alert('Challenge notes saved on this device.')}function toggleStep(id,i,checked){state.projectSteps[id+'-'+i]=checked;save()}function saveJournal(){state.notes=document.getElementById('journalText').value;save();alert('Notebook saved on this device.')}function addTopic(){let t=document.getElementById('newtopic').value.trim();if(t){state.customTopics.push(t);save();render()}}function removeTopic(i){state.customTopics.splice(i,1);save();render()}function copyText(t){navigator.clipboard?.writeText(t).then(()=>alert('Copied!')).catch(()=>prompt('Copy this:',t))}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ai-lab-progress.json';a.click();URL.revokeObjectURL(a.href)}function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.done)||typeof d.notes!=='string')throw Error();if(confirm('Replace current progress with this backup?')){state=d;state.projectSteps||={};state.customTopics||=[];save();render()}}catch{alert('Invalid AI Lab backup file.')}};r.readAsText(f)}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));render();
</script></body></html>
