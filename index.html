<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Lab | Learn. Build. Understand.</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9eef9;background:#090e1b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0%,#1b2c52 0,transparent 36%),#090e1b}button,input,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{padding:28px 16px;background:#0d1425;border-right:1px solid #253149}.brand{font-weight:850;font-size:23px;letter-spacing:.08em;margin:0 12px 6px}.brand span{color:#79a7ff}.tag{color:#8796b2;font-size:12px;margin:0 12px 36px}.nav{display:grid;gap:8px}.nav button{background:transparent;color:#a8b7d2;text-align:left;border:0;border-radius:10px;padding:13px 15px}.nav button.active,.nav button:hover{background:#1c2c4c;color:white}.foot{font-size:12px;color:#7f90ac;margin:34px 12px}.main{max-width:1100px;width:100%;margin:auto;padding:35px 38px 70px}.eyebrow{color:#81a8fb;font-weight:750;text-transform:uppercase;letter-spacing:.13em;font-size:12px}h1{font-size:clamp(30px,5vw,47px);margin:12px 0}h2{font-size:24px;margin:0 0 16px}h3{margin:0 0 8px}p{line-height:1.6;color:#b7c5df}.hero{background:linear-gradient(125deg,#203b6c,#142441 70%);border:1px solid #39517a;border-radius:20px;padding:30px;margin-bottom:24px}.hero p{max-width:680px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:22px 0}.stat,.panel,.lesson,.project{background:#121d31;border:1px solid #293a56;border-radius:16px;padding:22px}.stat strong{font-size:30px;display:block}.muted,.small{color:#8ea0bf;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.panel{margin:0 0 17px}.pill{display:inline-block;border-radius:99px;padding:5px 10px;background:#263e63;color:#b9d3ff;font-size:12px}.primary,.secondary{border:0;border-radius:10px;padding:12px 16px;font-weight:750;background:#81aaff;color:#081225}.secondary{background:#233957;color:#dce7fb;border:1px solid #3b5173}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.bar{height:8px;border-radius:8px;background:#28374f;overflow:hidden;margin-top:12px}.bar>div{height:100%;background:#79a7ff;transition:width .2s}.lesson,.project{margin-bottom:12px}.lesson-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.lesson h3{font-size:17px}.hidden{display:none!important}.content{max-width:790px}.content p{color:#c9d4e9}.content li{margin:12px 0;line-height:1.55}.question{padding:18px;background:#182740;border-radius:12px;margin:16px 0}.answer{display:block;width:100%;margin:8px 0;padding:12px;text-align:left;background:#0d182b;border:1px solid #3c5070;border-radius:9px;color:#e9eef9}.answer.selected{border-color:#8cb5ff;background:#243d62}.feedback{padding:14px;border-radius:10px;background:#223a54;margin:12px 0}.field{width:100%;background:#0d1728;border:1px solid #425574;border-radius:10px;padding:13px;color:#fff;min-height:48px}.promptbox{min-height:120px;resize:vertical}.note{font-size:13px;color:#9aacc8}.badge-done{color:#9de6c0}.section{margin-top:28px}.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.callout{border-left:3px solid #7ca9fa;padding:10px 16px;background:#172842;margin:18px 0;border-radius:0 10px 10px 0}.mobile-nav{display:none}@media(max-width:800px){.app{display:block}.sidebar{padding:17px;border-right:0;border-bottom:1px solid #263751}.brand{font-size:20px}.tag{margin-bottom:15px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.foot{display:none}.main{padding:22px 16px 60px}.grid,.cards3{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:22px}.hero{padding:22px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">AI <span>LAB</span></div><div class="tag">LEARN · BUILD · UNDERSTAND</div><nav class="nav" id="nav"><button data-view="home" class="active">⌂ &nbsp; Dashboard</button><button data-view="curriculum">▤ &nbsp; Curriculum</button><button data-view="explore">✧ &nbsp; Open Lab</button><button data-view="projects">⚒ &nbsp; Project Workshop</button><button data-view="journal">◫ &nbsp; Lab Notebook</button></nav><div class="foot">Your progress is stored in this browser.<br>Version 1.0 · No account required</div></aside><main class="main" id="main"></main></div><script>
const lessons=[
{id:'l1',level:1,title:'What is AI, really?',time:'10 min',intro:'AI is software trained or designed to perform tasks that normally require human judgment, such as recognizing patterns, interpreting language, or predicting outcomes.',why:'A language model does not look up every sentence in a giant answer book. During training it adjusts numerical parameters to predict patterns in data. At use time, it generates a response from the context and learned patterns.',example:'When you ask AI to plan a family vacation, it can produce a convincing itinerary even if a museum is closed. Clear writing does not guarantee accurate information.',challenge:'Ask an AI to plan a weekend trip without giving a destination, budget, dates, or transportation. Identify four questions it should ask instead of guessing.',q:'Why can an AI give a confident but incorrect answer?',choices:['It always searches the internet first','Generating plausible language is not the same as verifying facts','It secretly knows the answer but hides it'],correct:1,explain:'Models can generate fluent predictions without checking the truth. Grounding, source checks, and explicit constraints reduce this risk.'},
{id:'l2',level:1,title:'Tokens, context, and memory',time:'12 min',intro:'Language models process text in tokens, which may be whole words, word pieces, or punctuation. The context window is the information available during a particular response.',why:'A model needs context to follow a conversation. A long conversation can exceed what is available, and saved memory is different from the text currently inside a model’s context.',example:'A project instruction that says “never invent prices or opening hours” can change the model’s behavior. But a long chat does not guarantee every old instruction stays available.',challenge:'Write a five-line project brief for a meal planner that includes purpose, inputs, outputs, constraints, and how to handle unknown data.',q:'What is a context window?',choices:['The model’s available working information for a response','A permanent database of everything you have said','The computer monitor showing your chat'],correct:0,explain:'Context is the information available to the model for that response, not an unlimited permanent memory.'},
{id:'l3',level:1,title:'Prompting as specification writing',time:'12 min',intro:'A useful prompt defines the goal, relevant context, constraints, and the desired output. This is useful for work, hobbies, and everyday questions.',why:'Without constraints, a model fills gaps with likely assumptions. Specific instructions make the output easier to evaluate and repeat.',example:'“Compare these two vacation options; flag missing prices; do not assume availability; return a table” is more reliable than “Which vacation is best?”',challenge:'Rewrite a vague request into a structured prompt that clearly labels missing information.',q:'Which instruction most directly prevents invented technical details?',choices:['Make it sound professional','Use a confident tone','Mark missing specifications as unknown and ask for them'],correct:2,explain:'Explicit uncertainty handling tells the model what to do when evidence is missing.'},
{id:'l4',level:2,title:'How to verify AI research',time:'15 min',intro:'Treat generated answers as hypotheses until the important claims have evidence.',why:'Sources may be outdated, misread, biased, or unrelated. Even a citation can fail to support the exact claim.',example:'For a product recommendation, a high advertised rating is not proof of quality. Reliable research compares independent evidence, recent reviews, and the actual product specifications.',challenge:'Find three sources recommending the same product. Compare their evidence, dates, and possible incentives.',q:'What is the strongest basis for a reliable product recommendation?',choices:['One unusually expensive listing','Several independent, current sources with verifiable evidence','The seller’s claim that it is worth more'],correct:1,explain:'Independent, verifiable evidence is stronger than a single promotional claim.'},
{id:'l5',level:3,title:'APIs explained without the headache',time:'15 min',intro:'An API is a documented way for software to request data or actions from another system.',why:'Instead of copying information manually, an application sends a structured request and receives a structured response. Access still depends on permissions, limits, and available endpoints.',example:'A weather app can ask a weather service for forecast data. Not every website offers an API, and access to one service does not automatically grant access to another.',challenge:'Draw the flow: your app → API request → provider → response → your dashboard. Identify where errors and fees could occur.',q:'What does an API key commonly do?',choices:['Guarantee every request is free','Identify or authorize a caller','Make AI answers automatically accurate'],correct:1,explain:'Keys are credentials used to control access and track usage. Never place private API keys in public GitHub Pages code.'},
{id:'l6',level:4,title:'Automation vs. AI agents',time:'15 min',intro:'An automation follows a defined workflow. An agent can choose among tools or actions toward a goal, subject to its instructions and permissions.',why:'More autonomy creates more possibilities and more ways to fail. Reliable systems need logs, limits, checkpoints, and clear permission boundaries.',example:'A simple automation reminds you about an appointment. An agent might check your calendar, propose new times, and ask you to approve rescheduling.',challenge:'Design an agent that plans a grocery order but cannot place the order or spend money without approval.',q:'What is a sensible safeguard for an AI shopping agent?',choices:['Give it unlimited purchasing authority','Hide errors from the operator','Require approval before placing orders'],correct:2,explain:'Human approval protects against expensive errors and unexpected behavior.'},
{id:'l7',level:5,title:'Build a trustworthy AI workflow',time:'18 min',intro:'A production workflow needs data validation, error handling, observability, and tests, not just a clever prompt.',why:'An AI model is one component of a system. The system must handle missing inputs, uncertain outputs, and failed connections.',example:'A travel planner should record sources for opening hours, flag outdated information, and avoid confidently recommending unavailable activities.',challenge:'Write three test cases for a travel planner: missing dates, an attraction that is closed, and no reliable ticket prices. Describe the correct safe behavior.',q:'What should an AI system do with no trustworthy evidence?',choices:['Invent a midpoint price','Report low confidence and request more evidence','Use the most confident-sounding claim'],correct:1,explain:'Explicit uncertainty is a feature, not a defect.'},
{id:'l8',level:6,title:'RAG, fine-tuning, and evaluations',time:'20 min',intro:'Retrieval-augmented generation (RAG) supplies relevant reference information to a model. Fine-tuning changes model behavior through additional training. Evaluations measure how well the system performs.',why:'Use retrieval when the facts change or must be traceable. Consider fine-tuning for repeatable behavior or style when simpler methods are insufficient. Test either approach against real examples.',example:'A travel assistant should retrieve current transit schedules rather than relying on a model to memorize departure times.',challenge:'Design a 10-example evaluation set for an AI recipe assistant, including allergies, missing ingredients, and conflicting instructions.',q:'What is usually better for frequently changing product specifications?',choices:['Retrieval from a maintained source','Asking the model to guess','Never checking catalog revisions'],correct:0,explain:'Retrieval can access current, traceable information without retraining for every catalog update.'}
];

const projects=[
{id:'p1',name:'Prompt Repair Workshop',level:'Beginner',desc:'Turn vague instructions into useful, verifiable requests.',steps:['Identify the missing information','Write a clearer prompt','Test your prompt in the simulator','Explain what changed']},
{id:'p2',name:'Source Reliability Detective',level:'Beginner',desc:'Practice distinguishing evidence from unsupported claims.',steps:['Inspect the sample claim','Check whether the source supports it','Identify uncertainty','Write a responsible conclusion']},
{id:'p3',name:'Agent Safety Blueprint',level:'Intermediate',desc:'Design a workflow that requires approval for high-impact actions.',steps:['Define the goal','List permitted actions','Add approval checkpoints','Test an unsafe request']}
];
const storeKey='ai-lab-v1';
let state;try{state=JSON.parse(localStorage.getItem(storeKey))||{}}catch{state={}}
state.done=Array.isArray(state.done)?state.done:[];state.notes=typeof state.notes==='string'?state.notes:'';state.projectSteps=state.projectSteps||{};state.customTopics=state.customTopics||[];state.practice=state.practice||{};state.practiceDone=state.practiceDone||[];
let view='home',openLesson=null,selected=null,feedback='',practiceResult='',simResult='';
function save(){try{localStorage.setItem(storeKey,JSON.stringify(state))}catch(e){alert('Storage unavailable. Export a backup from Notebook.')}} 
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function progress(){return Math.round(lessons.filter(l=>state.done.includes(l.id)&&state.practiceDone.includes(l.id)).length/lessons.length*100)}
function btn(label,fn,cls='primary'){return '<button class="'+cls+'" onclick="'+fn+'">'+label+'</button>'}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let el=document.getElementById('main');if(openLesson){el.innerHTML=lessonView();return}el.innerHTML=({home,curriculum,explore,projects:projectView,journal})[view]()}
function home(){let next=lessons.find(l=>!state.done.includes(l.id)||!state.practiceDone.includes(l.id))||lessons[0];return '<div class="eyebrow">Interactive AI education · Free</div><h1>Learn it. Build it.<br>Understand it.</h1><div class="hero"><span class="pill">VERSION 2 · HANDS-ON</span><h2 style="margin-top:16px">Learn by experimenting, not copying prompts.</h2><p>Work through lessons and try the built-in prompt simulator. Your practice and quiz are tracked separately. Simulations are scripted examples, not a live AI model.</p>'+btn('Continue learning →',"startLesson('"+next.id+"')")+' '+btn('Open simulator',"go('explore')",'secondary')+'</div><div class="stats"><div class="stat"><strong>'+progress()+'%</strong><span class="muted">Both checks complete</span></div><div class="stat"><strong>'+state.done.length+'/'+lessons.length+'</strong><span class="muted">Quizzes passed</span></div><div class="stat"><strong>'+state.practiceDone.length+'/'+lessons.length+'</strong><span class="muted">Practice completed</span></div></div><div class="panel"><h2>How it works</h2><p>Read the explanation, complete a guided practice activity, then pass the knowledge check. Practice feedback is rule-based and shows what it checked. No account, subscription, or external AI required.</p></div>'}
function curriculum(){return '<div class="eyebrow">Structured learning</div><h1>Curriculum</h1><p>Eight lessons. Complete the practical exercise and quiz for each. Explore in any order.</p><div class="bar"><div style="width:'+progress()+'%"></div></div><div class="section">'+lessons.map(l=>'<div class="lesson"><div class="lesson-head"><div><span class="pill">LEVEL '+l.level+' · '+l.time+'</span><h3 style="margin-top:12px">'+esc(l.title)+'</h3><span class="small">'+esc(l.intro)+'</span></div></div><p class="small">Practice: '+(state.practiceDone.includes(l.id)?'✓ Complete':'Not completed')+' · Quiz: '+(state.done.includes(l.id)?'✓ Passed':'Not passed')+'</p>'+btn('Open lesson →',"startLesson('"+l.id+"')",'secondary')+'</div>').join('')+'</div>'}
const activities={
l1:{prompt:'Plan a weekend trip for my family.',missing:['destination','date','budget','transport'],tip:'A reliable assistant should ask for important missing details before producing a confident itinerary.'},
l2:{prompt:'Remember everything about my preferences forever.',missing:['context','memory','privacy'],tip:'A conversation context is not the same thing as permanent storage or a guaranteed memory.'},
l3:{prompt:'Tell me which laptop to buy.',missing:['budget','use','location'],tip:'A good prompt defines constraints, purpose, and what to do with unknown information.'},
l4:{prompt:'This product is the best because one review says so.',missing:['source','evidence','date'],tip:'One claim is not enough. Verify the evidence and whether it is current.'},
l5:{prompt:'Connect my app to a service.',missing:['api','permission','key'],tip:'API access depends on a documented endpoint, authorization, and secure handling of credentials.'},
l6:{prompt:'Let an AI order groceries automatically.',missing:['approval','limit','permission'],tip:'Agents need permission boundaries and human approval for spending.'},
l7:{prompt:'Build a system that always gives accurate results.',missing:['test','error','unknown'],tip:'Reliable systems explicitly handle failures, missing data, and evaluation.'},
l8:{prompt:'Make an AI answer questions about changing schedules.',missing:['retrieval','source','evaluation'],tip:'Use up-to-date retrieval and evaluations for changing facts.'}
};
function lessonView(){let l=lessons.find(x=>x.id===openLesson),a=activities[l.id],draft=state.practice[l.id]||'';return '<div class="content">'+btn('← Back to curriculum','closeLesson()','secondary')+'<div class="section eyebrow">Level '+l.level+' · '+l.time+'</div><h1>'+esc(l.title)+'</h1><div class="panel"><h2>What you are learning</h2><p>'+esc(l.intro)+'</p><h2>Why it works</h2><p>'+esc(l.why)+'</p><h2>Example</h2><p>'+esc(l.example)+'</p></div><div class="panel"><div class="eyebrow">Interactive practice</div><h2>Improve this request</h2><div class="callout">'+esc(a.prompt)+'</div><p>Rewrite it so the system knows what to do when information is missing. Try to address these concepts: <b>'+a.missing.map(esc).join(', ')+'</b>.</p><textarea id="practiceText" class="field promptbox" placeholder="Write your improved instruction here...">'+esc(draft)+'</textarea><div class="actions">'+btn('Check my practice',"checkPractice('"+l.id+"')")+'</div>'+ (practiceResult?'<div class="feedback">'+esc(practiceResult)+'</div>':'')+'<p class="note">Automated keyword feedback only. This is not a real AI evaluation, and a passing result does not prove mastery.</p></div><div class="panel"><div class="eyebrow">Knowledge check</div><h2>Test your understanding</h2><p>'+esc(l.q)+'</p>'+l.choices.map((c,i)=>'<button class="answer '+(selected===i?'selected':'')+'" onclick="choose('+i+')">'+esc(c)+'</button>').join('')+btn('Check answer',"checkAnswer('"+l.id+"')")+(feedback?'<div class="feedback">'+esc(feedback)+'</div>':'')+'</div></div>'}
function checkPractice(id){let t=document.getElementById('practiceText').value.trim();state.practice[id]=t;let a=activities[id],hits=a.missing.filter(w=>t.toLowerCase().includes(w));if(t.length<30){practiceResult='Add more detail. Explain the goal and what the system should do when facts are missing.'}else if(hits.length>=2){state.practiceDone=Array.from(new Set([...state.practiceDone,id]));practiceResult='Practice check complete: you included '+hits.join(', ')+'. '+a.tip+' This is a basic keyword check, not a judgment of whether the instruction is fully correct.'}else{practiceResult='Good start. Add more specific details about '+a.missing.filter(w=>!hits.includes(w)).join(', ')+'. '+a.tip}save();render()}
function explore(){return '<div class="eyebrow">Free interactive experiment</div><h1>Prompt Simulator</h1><p>Try a request and change its details. The simulated assistant shows how missing context affects a response. This is a deterministic teaching tool, not a live language model.</p><div class="panel"><h2>Weekend trip experiment</h2><label for="simDestination">Destination</label><input id="simDestination" class="field" placeholder="e.g. Chicago"><label for="simBudget">Budget</label><input id="simBudget" class="field" placeholder="e.g. $400"><label for="simDates">Dates</label><input id="simDates" class="field" placeholder="e.g. November 7–8"><label for="simTravel">Transportation</label><select id="simTravel" class="field"><option value="">Not specified</option><option>Driving</option><option>Flying</option><option>Public transit</option></select><div class="actions">'+btn('Run simulation','runSimulation()')+'</div><div id="simOutput" class="feedback" style="display:none"></div></div><div class="panel"><h2>Why this matters</h2><p>Missing information should lead to clarifying questions or explicitly labeled assumptions. More details can improve relevance, but they do not guarantee factual accuracy. Real travel prices and availability still require verification.</p></div><div class="panel"><h2>What should we explore next?</h2><input id="newtopic" class="field" placeholder="Add a topic to your learning queue"><div class="actions">'+btn('Add topic','addTopic()')+'</div>'+state.customTopics.map((t,i)=>'<p>'+esc(t)+' '+btn('Remove',"removeTopic("+i+")",'secondary')+'</p>').join('')+'</div>'}
function runSimulation(){let vals=['simDestination','simBudget','simDates','simTravel'].map(id=>document.getElementById(id).value.trim()),names=['destination','budget','dates','transportation'],missing=names.filter((_,i)=>!vals[i]);let out=document.getElementById('simOutput');out.style.display='block';out.textContent=missing.length?'Simulated assistant: Before I plan this trip, I need your '+missing.join(', ')+'. I should not invent those details.':'Simulated assistant: I have the destination ('+vals[0]+'), budget ('+vals[1]+'), dates ('+vals[2]+'), and transportation ('+vals[3]+'). I can now propose a plan, but I still need to verify current prices, hours, and availability. No live research has been performed.'}
function projectView(){return '<div class="eyebrow">Hands-on workshop</div><h1>Project workshop</h1><p>Use these as practice plans. Checklists track your work; they do not run code or evaluate results.</p>'+projects.map(p=>'<div class="project"><span class="pill">'+esc(p.level)+'</span><h2>'+esc(p.name)+'</h2><p>'+esc(p.desc)+'</p>'+p.steps.map((s,i)=>'<label style="display:flex;gap:12px;margin:14px 0"><input type="checkbox" '+(state.projectSteps[p.id+'-'+i]?'checked':'')+' onchange="toggleStep('+"'"+p.id+"'"+','+i+',this.checked)"> '+esc(s)+'</label>').join('')+'</div>').join('')}
function journal(){return '<div class="eyebrow">Learning notebook</div><h1>Lab notebook</h1><p>Your notes and progress are stored only in this browser.</p><div class="panel"><textarea id="journalText" class="field promptbox" style="min-height:260px">'+esc(state.notes)+'</textarea><div class="actions">'+btn('Save notes','saveJournal()')+' '+btn('Export progress','exportData()','secondary')+' '+btn('Import progress',"document.getElementById('importFile').click()",'secondary')+'</div><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(this)"></div>'}
function go(v){view=v;openLesson=null;selected=null;feedback='';practiceResult='';render();window.scrollTo(0,0)}
function startLesson(id){openLesson=id;selected=null;feedback='';practiceResult='';render();window.scrollTo(0,0)}
function closeLesson(){openLesson=null;view='curriculum';render()}
function choose(i){let p=document.getElementById('practiceText');if(p&&openLesson){state.practice[openLesson]=p.value;save()}selected=i;feedback='';render()}
function checkAnswer(id){let p=document.getElementById('practiceText');if(p){state.practice[id]=p.value;save()}let l=lessons.find(x=>x.id===id);if(selected===null)feedback='Select an answer first.';else if(selected===l.correct){feedback='Correct. '+l.explain;if(!state.done.includes(id))state.done.push(id);save()}else feedback='Not quite. '+l.explain;render()}
function toggleStep(id,i,checked){state.projectSteps[id+'-'+i]=checked;save()}
function saveJournal(){state.notes=document.getElementById('journalText').value;save();alert('Notes saved on this device.')}
function addTopic(){let t=document.getElementById('newtopic').value.trim();if(t){state.customTopics.push(t);save();render()}}
function removeTopic(i){state.customTopics.splice(i,1);save();render()}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ai-lab-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.done))throw Error('Invalid file');if(confirm('Replace saved progress with this backup?')){state={...state,...d};state.practiceDone||=[];state.practice||={};state.projectSteps||={};state.customTopics||=[];save();render()}}catch(e){alert('Invalid backup file.')}};r.readAsText(f)}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));render();
</script></body></html>
